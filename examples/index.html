<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>PreferencePanes 模块测试</title>
        <style>
            html, body { height: 100%; }
            body { margin: 0; display: flex; flex-direction: column; color: #202124; background: #f4f5f7; font: 14px/1.5 system-ui, sans-serif; }
            header { padding: 16px 20px; background: white; border-bottom: 1px solid #ddd; }
            .heading { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
            h1 { margin: 0; font-size: 20px; }
            .controls, form { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
            .controls { margin-bottom: 12px; }
            label { display: grid; gap: 4px; min-width: 0; }
            input, select { max-width: 100%; font: inherit; }
            button { padding: 6px 14px; font: inherit; }
            #status { margin: 8px 0 0; }
            #error { color: #b3261e; }
            iframe { display: block; flex: 1; width: 100%; min-height: 0; border: 0; background: white; }
            iframe[hidden] { display: none; }
        </style>
    </head>
    <body>
        <header>
            <div class="heading">
                <h1>PreferencePanes 全类型示例</h1>
                <button id="example" type="button">重载内置示例</button>
            </div>
            <div class="controls">
                <label>CSS 样式
                    <select id="css-mode">
                        <option value="builtin" selected>内置 CSS</option>
                        <option value="example">示例 CSS</option>
                        <option value="import">导入 CSS</option>
                    </select>
                </label>
                <label>CSS 文件<input id="css" type="file" accept=".css,text/css" disabled></label>
            </div>
            <form id="import">
                <label>BoxJS JSON<input id="boxjs" type="file" accept=".json,application/json" required></label>
                <button id="generate" type="submit" disabled>预览文件</button>
            </form>
            <p id="status" role="status">正在加载内置示例…</p>
            <p id="error" role="alert" hidden></p>
        </header>
        <iframe id="preview" title="模块设置预览" hidden></iframe>
        <script type="module" src="/importer.mjs"></script>
    </body>
</html>
