name: Validate PreferencePanes Package

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci --registry=https://registry.npmjs.org/ --@nsnanocat:registry=https://registry.npmjs.org/
      - run: npm run build
      - run: npm run check
      - run: node scripts/generate-apifox.mjs --check
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: preference-panes-package
          path: nsnanocat-preference-panes-*.tgz
          if-no-files-found: error
