name: Release PreferencePanes API and Page Assets

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: BellCubeDev/update-package-version-by-release-tag@v2
        with: { version: "${{ github.ref_name }}", keep-v: "false", ignore-semver-check: "false" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm ci --registry=https://registry.npmjs.org/ --@nsnanocat:registry=https://registry.npmjs.org/
      - run: npx biome format --write package.json
      - run: npm run check && npm run apifox:check
      - name: Publish common API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/api.js dist/module/index.html dist/module/index.mjs dist/module/navigation.mjs --clobber
